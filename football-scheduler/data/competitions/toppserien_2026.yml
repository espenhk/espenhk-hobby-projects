id: toppserien_2026
name: Toppserien
season: 2026
gender: women
format: league

# Scheduler-controlled, same as eliteserien_2026.yml — see its comment and
# issue #31.
movable: true

# Triple round-robin: every pairing meets three times (2 home/1 away or
# 1 home/2 away, alternating fairly across the roster) rather than the
# standard home-and-away double. `generate_fixtures` handles any
# `rounds_per_pairing`; for an even team count the mirrored-leg construction
# (legs 1 and 3 share an orientation, leg 2 is reversed) keeps every team's
# season-total home/away split within 1 of even — see
# `terminliste/rounds/round_robin.py` for the by-construction argument.
rounds_per_pairing: 3

# 12 teams -> 11 rounds per leg -> 33 rounds, 198 matches.
team_count: 12
teams:
  - aalesund_w
  - bodo_glimt_w
  - brann_w
  - haugesund_w
  - honefoss_w
  - lsk_kvinner_w
  - lyn_w
  - molde_w
  - roa_w
  - rosenborg_w
  - stabak_w
  - valerenga_w

# The real 2026 Toppserien window (verified 2026-08-16 via web search —
# multiple sources agree on 20 March kickoff and 7 November final round,
# excluding playoffs). Ends almost a month before Eliteserien/the season's
# outer envelope, and 33 rounds need every bit of the room this leaves: see
# `terminliste/model/loader.py::_validate_calendar_capacity` for the check
# that would catch this window being too tight.
start: 2026-03-20
end: 2026-11-07

# Saturday, deliberately the day before Eliteserien's Sunday: it makes the
# back-to-back home weekend the natural outcome for the six dual clubs rather
# than something the solver has to fight the weekday preference to reach.
preferred_weekday: saturday

# See eliteserien_2026.yml's min_rest_days comment.
min_rest_days: 2
match_window_days: 3

weights:
  preferred_weekday: 4.0
  consecutive_home_days: 25.0
  consecutive_away_days: 15.0
  home_away_breaks: 8.0
  home_away_balance: 6.0
  rest_comfort: 3.0
  soft_venue_preference: 5.0

comfortable_rest_days: 5
