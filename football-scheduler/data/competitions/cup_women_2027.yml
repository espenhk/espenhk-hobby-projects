# The 2026-27 Norwegian Football Cup (NM kvinner), women's side. Toppserien
# clubs enter at Round 2 — Round 1 (9 Sep 2026) is lower-division only and
# is not modelled here, since this project does not track those clubs.
#
# verified: false — Round 2's date is NFF-confirmed via web search; NFF has
# not yet published exact dates beyond Round 2, so Round 3 onward are
# placeholder dates spaced the way NFF has said those rounds fall (spring
# 2027, final end of May) — see each round's `note`.
# sources:
#   - "fotball.no: NM Kvinner 2027 — Slik spilles første runde (Round 1: 9 Sep 2026, Round 2: 21 Oct 2026, Toppserien enters at Round 2)"
#   - "vg.no: NFF tar grep — flytter også kvinnens NM-finale til våren (women's final also moved to spring)"
id: cup_women_2027
name: NM Cupen (kvinner)
season: 2027
gender: women
format: cup

# Same 12 clubs as toppserien_2026.
team_count: 12
teams:
  - aalesund_w
  - bodo_glimt_w
  - brann_w
  - haugesund_w
  - honefoss_w
  - lsk_kvinner_w
  - lyn_w
  - molde_w
  - roa_w
  - rosenborg_w
  - stabak_w
  - valerenga_w

min_rest_days: 3

cup_rounds:
  - id: r2
    name: Round 2
    date: 2026-10-21
    note: "Confirmed — NFF terminliste. Toppserien enters at Round 2; Round 1 (9 Sep 2026) is lower-division only."
  - id: r3
    name: Round 3
    date: 2027-03-17
    note: "Estimated — NFF places the remaining rounds in spring 2027; exact date not yet published."
  - id: qf
    name: Quarter-final
    date: 2027-04-07
    note: "Estimated — spring 2027; exact date not yet published."
  - id: sf
    name: Semi-final
    date: 2027-04-28
    note: "Estimated — spring 2027; exact date not yet published."
  - id: final
    name: Final
    date: 2027-05-30
    note: "Estimated Sunday — NFF has said the final is planned for the end of May 2027, traditionally the same weekend as the men's final."
