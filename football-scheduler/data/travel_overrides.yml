# Curated surface travel times (hours, bus or train) for venue pairs, used by
# terminliste/model/travel.py's ApiTravelModel.
#
# Ground travel is normally read from data/.refdata_cache/travel.json, a
# cache of real routes fetched from OSRM by `cli.py refresh-travel-times`
# (gitignored — regenerate it locally; it's empty in a fresh clone). This
# file exists for the rare pair where a routing API still gets it wrong —
# e.g. north of Trondheim, where the "route" isn't really a same-trip option
# even though a road technically connects the dots — and always wins over
# both the cached fetch and the flight-time estimate.
#
# `hours: null` means "no reasonable surface connection" — treated as infinite,
# so the away-day pairing bonus never fires for that pair.
verified: false
sources:
  - "General knowledge of Norwegian road/rail distances; cross-check against `cli.py refresh-travel-times`"

overrides:
  # Nord-Norge: not reachable by bus/train in any schedulable window.
  - {a: romssa_arena, b: aspmyra_stadion, hours: null, note: "Tromsø–Bodø: ~11h drive, effectively fly-only"}
  - {a: romssa_arena, b: lerkendal_stadion, hours: null, note: "Tromsø–Trondheim: ~17h"}
  - {a: romssa_arena, b: intility_arena, hours: null, note: "Tromsø–Oslo: ~22h"}
  - {a: aspmyra_stadion, b: lerkendal_stadion, hours: 10.5, note: "Bodø–Trondheim by train"}
  - {a: aspmyra_stadion, b: intility_arena, hours: null, note: "Bodø–Oslo: ~17h"}

  # Over the mountains: great-circle badly understates these.
  - {a: brann_stadion, b: intility_arena, hours: 7.5, note: "Bergen–Oslo by train"}
  - {a: brann_stadion, b: lerkendal_stadion, hours: 14.0, note: "Bergen–Trondheim, no direct route"}
  - {a: sr_bank_arena, b: intility_arena, hours: 7.5, note: "Stavanger–Oslo"}
  - {a: sr_bank_arena, b: brann_stadion, hours: 5.0, note: "Stavanger–Bergen, ferries"}

  # Møre og Romsdal: coastal, slow.
  - {a: color_line_stadion, b: intility_arena, hours: 9.0, note: "Ålesund–Oslo"}
  - {a: color_line_stadion, b: aker_stadion, hours: 2.0, note: "Ålesund–Molde"}
  - {a: aker_stadion, b: kristiansund_stadion, hours: 1.5, note: "Molde–Kristiansund"}
  - {a: aker_stadion, b: intility_arena, hours: 8.5, note: "Molde–Oslo"}
  - {a: aker_stadion, b: lerkendal_stadion, hours: 4.0, note: "Molde–Trondheim"}
  - {a: kristiansund_stadion, b: lerkendal_stadion, hours: 3.5, note: "Kristiansund–Trondheim"}
