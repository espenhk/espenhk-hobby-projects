# Clubs and the teams they field.
#
# A club owns teams; a team has a gender, a level, and a home venue. Levels
# beyond `senior` (second teams, youth) are already expressible — adding a
# reserve side is a data edit here, not a code change.
#
# Six clubs field both a men's and a women's senior team (Aalesund, Bodø/Glimt,
# Brann, Molde, Rosenborg, Vålerenga). Those pairs drive the club-level rules:
# never both home on the same day, but back-to-back home days are a bonus.
#
# Lillestrøm SK and LSK Kvinner are separate clubs that share Åråsen Stadion —
# the venue rule binds them even though the club rule does not.
verified: false
sources:
  - "wikipedia:2026_Eliteserien (via web search snippets)"
  - "wikipedia:2026_Toppserien (via web search snippets)"

clubs:
  # -- clubs with both a men's and a women's senior team ---------------------
  - id: aalesund
    name: Aalesunds FK
    short_name: AaFK
    city: Ålesund
    teams:
      - {id: aalesund_m, gender: men, level: senior, home_venue: color_line_stadion}
      - {id: aalesund_w, gender: women, level: senior, home_venue: color_line_stadion}

  - id: bodo_glimt
