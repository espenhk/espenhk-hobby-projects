# Clubs and the teams they field.
#
# A club owns teams; a team has a gender, a level, and a home venue. Levels
# beyond `senior` (second teams, youth) are already expressible — adding a
# reserve side is a data edit here, not a code change.
#
# Six clubs field both a men's and a women's senior team (Aalesund, Bodø/Glimt,
# Brann, Molde, Rosenborg, Vålerenga). Those pairs drive the club-level rules:
# never both home on the same day, but back-to-back home days are a bonus.
#
# Lillestrøm SK and LSK Kvinner are separate clubs that share Åråsen Stadion —
# the venue rule binds them even though the club rule does not.
verified: false
sources:
  - "wikipedia:2026_Eliteserien (via web search snippets)"
  - "wikipedia:2026_Toppserien (via web search snippets)"
  - "2026-08-16 re-check: the 22-club, 28-team roster below (16 Eliteserien +
    12 Toppserien, 6 overlapping as dual clubs) was cross-checked against
    fresh web-search results and matches. Club names, short names and cities
    were not re-verified letter-by-letter against an official source, so
    `verified` stays false — see venues.yml for why a blanket correction
    pass wasn't attempted this round, and cli.py refresh-reference-data for
    a live-API path to close this out for real."
  - "2026-08-16 addition: each club's `color` is a best-effort primary kit
    colour from general knowledge, adjusted where two clubs share a real
    hue (several are 'yellow and black') so their report markers stay
    distinguishable. Not checked against an official club style guide —
    same `verified: false` caveat as the rest of this file."

clubs:
  # -- clubs with both a men's and a women's senior team ---------------------
  - id: aalesund
    name: Aalesunds FK
    short_name: AaFK
    city: Ålesund
    color: "#d9a404"
    teams:
