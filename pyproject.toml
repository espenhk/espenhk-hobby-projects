[tool.poetry]
name = "espenhk-hobby-projects"
version = "0.1.0"
description = "Independent hobby projects sharing a Poetry-managed virtual environment"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.skate.dependencies]
pandas = ">=2.0"
pdfplumber = ">=0.11"

[tool.poetry.group.skate-test.dependencies]
pytest = ">=8.0"

[tool.poetry.group.conversational-analytics.dependencies]
duckdb = ">=1.0"
pydantic = ">=2.5"
pyyaml = ">=6.0"
jsonschema = ">=4.20"
jinja2 = ">=3.1"
anthropic = ">=0.40"
pandas = ">=2.0"
pyarrow = ">=15.0"
numpy = ">=1.26"
fastapi = ">=0.110"
uvicorn = ">=0.30"

[tool.poetry.group.conversational-analytics-test.dependencies]
pytest = ">=8.0"

[tool.poetry.group.football-scheduler.dependencies]
pydantic = ">=2.5"
pyyaml = ">=6.0"
jinja2 = ">=3.1"

[tool.poetry.group.football-scheduler-test.dependencies]
pytest = ">=8.0"

[tool.poetry.group.football-scheduler-cpsat]
optional = true

[tool.poetry.group.football-scheduler-cpsat.dependencies]
ortools = ">=9.9"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = [
    "E501",  # line-too-long: repo has no formatter yet; not worth a wholesale reformat
    "F821",  # undefined-name: pre-existing bug in skate/ui/cli.py, out of scope here
    "B017",  # assert-raises-exception: existing tests assert bare Exception on purpose
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
