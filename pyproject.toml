[tool.poetry]
name = "espenhk-hobby-projects"
version = "0.1.0"
description = "Ice skating race predictor and Trackmania AI"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# common
pandas = ">=2.0"

# skate
pdfplumber = ">=0.11"
PyPDF2 = ">=3.0.0"

# tmnf
numpy = ">=1.26"
scipy = ">=1.12"
gymnasium = ">=0.29"
stable-baselines3 = ">=2.0"
pyyaml = ">=6.0"
tensorboard = ">=2.0"
matplotlib = ">=3.8"
opencv-python = ">=4.8"
mss = ">=9.0"
pywin32 = ">=306"
tminterface = ">=1.0"
pygbx = ">=0.3"

# Not on PyPI — install from source first:
# tminterface
# pygbx

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
