# Grid search config template — copy this file and edit before running.
# Usage (from tmnf/):
#   python grid_search.py config/my_grid.yaml [--no-interrupt]
#
# Any param set to a list becomes a search axis.
# One run is created per unique combination of list-valued params.
# Experiment names encode only the varied params, e.g.:
#   gs_v1__ms0.05__cw_n0.1__ab0.5
#   gs_v1__ms0.05__cw_n0.1__ab1
#   ...
#
# This template sweeps the three axes identified in the reward analysis:
#   mutation_scale (search sensitivity) × centerline_weight × accel_bonus
#   → 3 × 3 × 3 = 27 combinations

base_name: "gs_v1"

# ---------------------------------------------------------------------------
# Training params — listed axes become search dimensions
# ---------------------------------------------------------------------------
training_params:
  speed: 10.0
  n_sims: 50
  in_game_episode_s: 13.0
  mutation_scale: [0.05, 0.1, 0.2]   # most important: hill-climb step size
  probe_s: 8.0
  cold_restarts: 5
  cold_sims: 20

# ---------------------------------------------------------------------------
# Reward params — listed axes become search dimensions
# ---------------------------------------------------------------------------
reward_params:
  progress_weight: 10000.0
  centerline_weight: [-0.05, -0.1, -0.5]  # centerline strictness
  centerline_exp: 2.0
  speed_weight: 0.05
  step_penalty: -0.05
  finish_bonus: 5000.0
  finish_time_weight: -5.0
  par_time_s: 60.0
  accel_bonus: [0.5, 1.0, 2.0]            # coasting-prevention strength
  airborne_penalty: -1.0
  crash_threshold_m: 25.0
