name: football-scheduler test suite

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      suites:
        description: >
          Space-separated list of folders under football-scheduler/tests/
          to run, e.g. "solvers integration". Use "." to run everything.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suites }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-fs-${{ runner.os }}-py3.11-${{ hashFiles('poetry.lock') }}

      # The optional football-scheduler-cpsat group is left out; cpsat tests skip without ortools.
      - name: Install dependencies
        run: poetry install --only football-scheduler,football-scheduler-test

      - name: Run tests
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          paths=""
          for suite in $SUITES; do
            paths="$paths football-scheduler/tests/$suite"
          done
          poetry run python -m pytest $paths -v
