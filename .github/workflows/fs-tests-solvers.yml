# Path -> suites mapping is documented in football-scheduler/tests/README.md.
name: football-scheduler tests (solvers)

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "football-scheduler/terminliste/solvers/**"
      - "football-scheduler/tests/solvers/**"
      - "football-scheduler/tests/integration/**"
      - ".github/workflows/fs-tests-solvers.yml"

jobs:
  test:
    # Skip draft PRs, but always run when a draft is converted to ready for review.
    if: github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    uses: ./.github/workflows/football-scheduler-tests-reusable.yml
    with:
      suites: "solvers integration"
