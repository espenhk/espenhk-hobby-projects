name: terraform-apply-nonprod

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Terraform workspace to apply"
        required: true
        type: choice
        options:
          - dev
          - test

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: terraform-nonprod-apply
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          set -euo pipefail
          cd dataplatform-beta/terraform/deployment
          terraform init -backend=false

      - name: Select workspace
        run: |
          set -euo pipefail
          cd dataplatform-beta/terraform/deployment
          terraform workspace select ${{ inputs.target_env }} || terraform workspace new ${{ inputs.target_env }}

      - name: Terraform apply
        run: |
          set -euo pipefail
          cd dataplatform-beta/terraform/deployment
          if [ -f terraform.tfvars ]; then
            terraform apply -input=false -auto-approve -var-file=terraform.tfvars
          elif [ -f terraform.tfvars.example ]; then
            terraform apply -input=false -auto-approve -var-file=terraform.tfvars.example
          else
            terraform apply -input=false -auto-approve
          fi
