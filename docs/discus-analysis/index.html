<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discus angle of attack</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo, useState } = React;

/* ============================================================================
 * WHY ELITE DISCUS THROWERS RELEASE WITH A NEGATIVE ANGLE OF ATTACK
 *
 * Angles (all in degrees, all in the vertical plane of the throw):
 *   beta  (β) — flight-path angle: the velocity vector above horizontal
 *   theta (θ) — attitude angle: the plane of the disc above horizontal
 *   alpha (α) — angle of attack = θ − β  (2-D idealisation)
 *   phi   (φ) — tilt/roll out of that plane. NOT simulated here; see caveats.
 *
 * The physics below is a pure function of its parameters. Nothing in this
 * section touches React, so the model can be read (and checked) on its own.
 * ==========================================================================*/

/* ---- Physical constants -------------------------------------------------
 * Men's competition discus, ISO standard air. All PUBLISHED / definitional.  */
const RHO = 1.225;                       // kg/m^3, sea-level standard air
const G = 9.81;                          // m/s^2
const MASS = 2.0;                        // kg, men's discus
const DIAM = 0.22;                       // m, men's discus diameter
const AREA = Math.PI * (DIAM / 2) ** 2;  // 0.0380 m^2 planform area
const SPIN_HZ = 6.6;                     // rev/s, typical elite release spin
const OMEGA = 2 * Math.PI * SPIN_HZ;     // rad/s
const I_SPIN = 0.5 * MASS * (DIAM / 2) ** 2; // 0.0121 kg m^2, disc about its axis
const DEG = Math.PI / 180;

/* ---- Aerodynamic coefficients -------------------------------------------
 * These APPROXIMATE published wind-tunnel behaviour; they are not a published
 * table. What is taken from the literature vs. tuned here is spelled out in
 * the UI (see COEFF_PROVENANCE) and in the caveat panel.
 *
 * The crux: a discus is nearly top/bottom symmetric, so it makes NO lift at
 * α = 0 and NEGATIVE lift at negative α. There is no camber offset to hide
 * behind — C_L(0) = 0 exactly.                                              */
const STALL_DEG = 30;      // published: stall in the high 20s / near 30 deg
const CL_SLOPE = 0.04;     // published order: ~0.04 per degree
const CL_PEAK = CL_SLOPE * STALL_DEG;  // 1.20 at the stall angle
const CL_POST = 0.60;      // tuned: lift retained just past the abrupt drop
const CD0 = 0.022;         // published order: minimum drag near zero lift
const CD_K = 3.0;          // TUNED drag scale (see validation panel)
const CD_CAP = 1.25;       // bluff-body ceiling, disc broadside to the flow
const CM_SLOPE = 0.0065;   // published order: +0.006..0.007 per deg, nose-up
const CM_SAT_DEG = 38;     // moment saturates once the flow is fully separated

/** Lift coefficient. Odd in α (symmetric section), linear to stall, then an
 *  abrupt drop, then a slow decay toward zero at 90 deg. */
function liftCoefficient(alphaDeg) {
  const s = Math.sign(alphaDeg);
  const a = Math.abs(alphaDeg);
  if (a <= STALL_DEG) return s * CL_SLOPE * a;
  if (a <= STALL_DEG + 6) return s * (CL_PEAK - ((CL_PEAK - CL_POST) / 6) * (a - STALL_DEG));
  return s * CL_POST * Math.max(0, (90 - a) / (90 - STALL_DEG - 6));
}

/** Drag coefficient. Minimum at zero lift, rising monotonically with |α| and
 *  continuing to rise past stall. Even in α. */
function dragCoefficient(alphaDeg) {
  const s = Math.sin(Math.abs(alphaDeg) * DEG);
  return Math.min(CD0 + CD_K * s * s, CD_CAP);
}

/** Pitching-moment coefficient: POSITIVE (nose-up) for positive α. This is why
 *  a positive α tends to grow on a non-spinning disc — and why a SPINNING disc
 *  precesses instead. Diagnostic only: it does not feed the 2-D translation. */
function momentCoefficient(alphaDeg) {
  const a = Math.max(-CM_SAT_DEG, Math.min(CM_SAT_DEG, alphaDeg));
  return CM_SLOPE * a;
}

/**
 * Integrate one throw. Pure function: params in, trajectory out.
 *
 * @param {object} p
 *  beta      release flight-path angle, deg
 *  theta     release attitude angle, deg (held fixed in flight — gyroscopic
 *            stiffness — unless lockAlpha is set)
 *  v0        release speed, m/s
 *  wind      horizontal wind, m/s; POSITIVE = tailwind (blowing downrange),
 *            NEGATIVE = headwind
 *  y0        release height, m
 *  lockAlpha if true, α is held at alphaLock and θ is whatever tracks it
 *  alphaLock the locked angle of attack, deg
 *  dt        RK4 step (default 0.001 s)
 *  sampleEvery  store one sample per N steps (integration is always at dt)
 *
 * @returns {{samples: Array, range: number, ...}} trajectory + diagnostics
 */
function simulate(p) {
  const dt = p.dt ?? 0.001;
  const sampleEvery = p.sampleEvery ?? 10;
  const wind = p.wind ?? 0;
  const y0 = p.y0 ?? 1.65;
  const b0 = p.beta * DEG;

  // state = [x, y, vx, vy]
  let s = [0, y0, p.v0 * Math.cos(b0), p.v0 * Math.sin(b0)];

  /** Instantaneous aerodynamic geometry at a given state. */
  const geom = (st) => {
    const ux = st[2] - wind;   // velocity relative to the AIR
    const uy = st[3];
    const V = Math.hypot(ux, uy) || 1e-9;
    const betaAir = Math.atan2(uy, ux) / DEG;
    const alpha = p.lockAlpha ? p.alphaLock : p.theta - betaAir;
    const theta = p.lockAlpha ? betaAir + p.alphaLock : p.theta;
    return { ux, uy, V, betaAir, alpha, theta };
  };

  const deriv = (st) => {
    const { ux, uy, V, alpha } = geom(st);
    const q = 0.5 * RHO * V * V * AREA;
    const L = q * liftCoefficient(alpha);   // perpendicular to relative velocity
    const D = q * dragCoefficient(alpha);   // opposing relative velocity
    // drag along -u_hat; lift along u_hat rotated +90 deg = (-uy, ux)/V
    const ax = (-D * ux / V - L * uy / V) / MASS;
    const ay = (-D * uy / V + L * ux / V) / MASS - G;
    return [st[2], st[3], ax, ay];
  };
  const step = (a, k, h) => a.map((v, i) => v + h * k[i]);

  const samples = [];
  let t = 0;
  let rollRad = 0;          // accumulated gyroscopic precession, diagnostic
  let apex = y0;
  let maxAlpha = -Infinity;
  let stallTime = null;
  let monotoneAlpha = true;
  let prevAlpha = null;
  let alphaRelease = null;

  const push = (st, tt, g) => {
    const q = 0.5 * RHO * g.V * g.V * AREA;
    samples.push({
      t: tt, x: st[0], y: st[1], vx: st[2], vy: st[3],
      v: Math.hypot(st[2], st[3]), vAir: g.V,
      alpha: g.alpha, beta: g.betaAir, theta: g.theta,
      cl: liftCoefficient(g.alpha), cd: dragCoefficient(g.alpha),
      lift: q * liftCoefficient(g.alpha), drag: q * dragCoefficient(g.alpha),
      moment: q * DIAM * momentCoefficient(g.alpha),
    });
  };

  const MAX_STEPS = 30000;   // 30 s guard; real flights are 2.5–6 s
  let i = 0;
  for (; i < MAX_STEPS; i++) {
    const g = geom(s);
    if (i === 0) alphaRelease = g.alpha;
    if (prevAlpha !== null && g.alpha < prevAlpha - 1e-9) monotoneAlpha = false;
    prevAlpha = g.alpha;
    if (g.alpha > maxAlpha) maxAlpha = g.alpha;
    if (stallTime === null && g.alpha > STALL_DEG) stallTime = t;
    if (s[1] > apex) apex = s[1];
    // Gyroscopic precession rate from the aerodynamic moment: Omega = M / (I w).
    // On a spinning disc this shows up mainly as ROLL, not pitch — integrated
    // here purely to show how badly the "theta is frozen" assumption ages.
    rollRad += (0.5 * RHO * g.V * g.V * AREA * DIAM * momentCoefficient(g.alpha)) / (I_SPIN * OMEGA) * dt;
    if (i % sampleEvery === 0) push(s, t, g);

    const k1 = deriv(s);
    const k2 = deriv(step(s, k1, dt / 2));
    const k3 = deriv(step(s, k2, dt / 2));
    const k4 = deriv(step(s, k3, dt));
    const next = s.map((v, j) => v + (dt / 6) * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));

    if (next[1] <= 0) {                       // ground: interpolate to y = 0
      const f = s[1] / (s[1] - next[1]);
      const land = s.map((v, j) => v + f * (next[j] - s[j]));
      land[1] = 0;
      push(land, t + f * dt, geom(land));
      s = land; t += f * dt;
      break;
    }
    s = next; t += dt;
  }

  const last = samples[samples.length - 1];
  return {
    samples,
    range: last.x,
    flightTime: last.t,
    apex,
    maxAlpha,
    stallTime,
    monotoneAlpha,
    alphaRelease,
    alphaLanding: last.alpha,
    betaLanding: last.beta,
    impactSpeed: last.v,
    precessionDeg: rollRad / DEG,
    truncated: i >= MAX_STEPS,
  };
}

/** Closed-form vacuum range for the same release: no air at all. */
function vacuumRange(beta, v0, y0) {
  const vx = v0 * Math.cos(beta * DEG);
  const vy = v0 * Math.sin(beta * DEG);
  return (vx * (vy + Math.sqrt(vy * vy + 2 * G * y0))) / G;
}

/* ============================================================================
 * Presentation
 * ==========================================================================*/

// Palette: categorical slots validated for colour-vision deficiency and for
// contrast on a white surface. Colour follows the entity, everywhere.
const C = {
  theta: "#2a78d6",   // blue    — disc attitude
  beta: "#4a3aa7",    // violet  — velocity direction
  alpha: "#1baf7a",   // aqua    — angle of attack
  stall: "#d03b3b",   // red     — status: stalled (always paired with a label)
  cl: "#2a78d6",
  cd: "#eb6834",
  ink: "#0b0b0b",
  ink2: "#52514e",
  grid: "#e6e5e1",
  vacuum: "#9a9891",
};

const PRESETS = [
  { key: "elite", name: "Elite still air", beta: 35, theta: 26, v0: 25, wind: 0,
    note: "α ≈ −9° at release. Roughly the release the literature associates with elite men." },
  { key: "flat", name: "Naive flat", beta: 35, theta: 35, v0: 25, wind: 0,
    note: "α = 0 at release: zero lift at the start, and deeper into stall by apex." },
  { key: "noseup", name: "Nose-up stalled", beta: 35, theta: 50, v0: 25, wind: 0,
    note: "α = +15° at release. Crosses the stall angle early and drags the rest of the way." },
  { key: "head", name: "Headwind slice", beta: 35, theta: 18, v0: 25, wind: -10,
    note: "A headwind raises airspeed and flattens the relative flow: slice it in flatter still." },
  { key: "tail", name: "Tailwind kite", beta: 35, theta: 40, v0: 25, wind: 10,
    note: "A tailwind cuts airspeed; the disc has to be carried at a higher attitude to work at all." },
];

const COEFF_PROVENANCE = [
  ["C_L(0) = 0 exactly, C_L odd in α", "published", "Near top/bottom symmetric section — no lift at zero incidence, negative lift below it."],
  ["dC_L/dα ≈ 0.04 /deg", "published order", "Linear band up to stall; gives C_L ≈ 1.2 at 30°."],
  ["Stall ≈ 30°", "published order", "Abrupt lift loss; drag keeps climbing through it."],
  ["C_D0 ≈ 0.022", "published order", "Minimum drag sits at zero lift, not at zero α of the body axis."],
  ["C_D = C_D0 + 3.0·sin²α (cap 1.25)", "TUNED HERE", "Scale 3.0 chosen so range and wind sensitivity land in the published band; it puts C_D ≈ 0.77 at 30°, above the ≈0.5–0.6 usually quoted. That is the price of pairing the 0.04/deg lift slope with realistic ranges."],
  ["Post-stall C_L retention 0.60", "TUNED HERE", "Shape of the drop past stall is a guess constrained only by 'abrupt'."],
  ["dC_M/dα ≈ +0.0065 /deg (nose-up)", "published order", "Modelled as a diagnostic, not fed into the 2-D translation — see caveats."],
];

/* ---- tiny chart helpers -------------------------------------------------- */
const fmt = (n, d = 1) => (Number.isFinite(n) ? n.toFixed(d) : "–");
function makeScale(d0, d1, r0, r1) {
  return (v) => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0);
}

function AxisLabel({ x, y, children, anchor = "middle", size = 11, fill = C.ink2, weight = 400 }) {
  return (
    <text x={x} y={y} textAnchor={anchor} fontSize={size} fill={fill} fontWeight={weight}>
      {children}
    </text>
  );
}

function LegendRow({ items }) {
  return (
    <div className="flex flex-wrap items-center gap-x-5 gap-y-1 text-xs text-slate-600">
      {items.map((it) => (
        <span key={it.label} className="inline-flex items-center gap-2">
          <svg width="20" height="8" aria-hidden="true">
            <line x1="0" y1="4" x2="20" y2="4" stroke={it.color} strokeWidth="2.5"
              strokeDasharray={it.dash ? "4 3" : undefined} strokeLinecap="round" />
          </svg>
          <span>{it.label}</span>
        </span>
      ))}
    </div>
  );
}

function Card({ title, subtitle, children, right }) {
  return (
    <section className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div className="mb-3 flex items-start justify-between gap-4">
        <div>
          <h2 className="text-sm font-semibold tracking-tight text-slate-900">{title}</h2>
          {subtitle && <p className="mt-0.5 text-xs leading-relaxed text-slate-500">{subtitle}</p>}
        </div>
        {right}
      </div>
      {children}
    </section>
  );
}

function Slider({ label, unit, value, min, max, step, onChange, color, hint, decimals = 0, signed = false }) {
  return (
    <label className="block">
      <div className="flex items-baseline justify-between">
        <span className="text-xs font-medium text-slate-700">{label}</span>
        <span className="font-mono text-xs tabular-nums text-slate-900" style={{ color }}>
          {signed && value > 0 ? "+" : ""}{fmt(value, decimals)} {unit}
        </span>
      </div>
      <input
        type="range"
        className="mt-1 w-full accent-slate-700"
        min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(parseFloat(e.target.value))}
      />
      {hint && <span className="text-xs text-slate-400">{hint}</span>}
    </label>
  );
}

/* ---- 1. Trajectory with oriented disc glyphs ----------------------------- */
function TrajectoryChart({ run, vacRange, beta, v0, y0, hoverT, setHoverT }) {
  const W = 940, H = 340, ML = 44, MR = 26, MT = 18, MB = 34;
  const pw = W - ML - MR, ph = H - MT - MB;

  // The disc-angle drawing is only truthful if the axes are ISOTROPIC.
  const xMax = Math.max(run.range, vacRange, 20) * 1.06;
  const aspect = ph / pw;
  const yMax = Math.max(xMax * aspect, run.apex * 1.15);
  const xMaxAdj = yMax / aspect;

  const sx = makeScale(0, xMaxAdj, ML, ML + pw);
  const sy = makeScale(0, yMax, MT + ph, MT);
  const mPerPx = xMaxAdj / pw;

  const path = run.samples.map((s, i) => `${i ? "L" : "M"}${sx(s.x).toFixed(1)} ${sy(s.y).toFixed(1)}`).join(" ");

  // vacuum reference for the same beta, v0, y0
  const vacPts = [];
  {
    const vx = v0 * Math.cos(beta * DEG), vy = v0 * Math.sin(beta * DEG);
    const T = (vy + Math.sqrt(vy * vy + 2 * G * y0)) / G;
    for (let k = 0; k <= 60; k++) {
      const t = (k / 60) * T;
      vacPts.push([vx * t, y0 + vy * t - 0.5 * G * t * t]);
    }
  }
  const vacPath = vacPts.map(([x, y], i) => `${i ? "L" : "M"}${sx(x).toFixed(1)} ${sy(Math.max(0, y)).toFixed(1)}`).join(" ");

  // glyphs every 0.4 s: disc plane (theta) and velocity direction (beta)
  const glyphs = [];
  const stride = 0.4;
  for (let t = 0; t <= run.flightTime; t += stride) {
    const s = run.samples[Math.min(run.samples.length - 1, Math.round((t / run.flightTime) * (run.samples.length - 1)))];
    glyphs.push(s);
  }
  const discHalf = 1.1 / mPerPx;   // disc drawn ~2.2 m long: 10x actual size
  const velLen = 2.6 / mPerPx;

  const hov = hoverT == null ? null
    : run.samples[Math.min(run.samples.length - 1, Math.round((hoverT / run.flightTime) * (run.samples.length - 1)))];

  const seg = (s, half, angDeg, extra = {}) => {
    const cx = sx(s.x), cy = sy(s.y);
    const a = -angDeg * DEG;   // SVG y grows downward
    return <line x1={cx - half * Math.cos(a)} y1={cy - half * Math.sin(a)}
      x2={cx + half * Math.cos(a)} y2={cy + half * Math.sin(a)} {...extra} />;
  };

  // Forward-pointing airspeed vector: in still air it lies along the path, in
  // wind it does not — alpha is always measured from THIS direction.
  const arrow = (s, len, extra = {}) => {
    const cx = sx(s.x), cy = sy(s.y), a = -s.beta * DEG;
    const hx = cx + len * Math.cos(a), hy = cy + len * Math.sin(a);
    const w = 3.4;
    return (
      <g {...extra}>
        <line x1={cx} y1={cy} x2={hx} y2={hy} />
        <path d={`M${hx} ${hy}L${hx - 7 * Math.cos(a) + w * Math.sin(a)} ${hy - 7 * Math.sin(a) - w * Math.cos(a)}
                  L${hx - 7 * Math.cos(a) - w * Math.sin(a)} ${hy - 7 * Math.sin(a) + w * Math.cos(a)}Z`}
          fill={extra.stroke} stroke="none" />
      </g>
    );
  };

  // The wedge between airspeed direction and disc plane IS alpha, to scale.
  const wedge = (s, r) => {
    const cx = sx(s.x), cy = sy(s.y);
    const b = -s.beta * DEG, th = -s.theta * DEG;
    const stalled = s.alpha > STALL_DEG;
    return (
      <path d={`M${cx} ${cy}L${cx + r * Math.cos(b)} ${cy + r * Math.sin(b)}
                A${r} ${r} 0 0 ${s.alpha < 0 ? 1 : 0} ${cx + r * Math.cos(th)} ${cy + r * Math.sin(th)}Z`}
        fill={stalled ? C.stall : C.alpha} opacity={0.45} stroke="none" />
    );
  };

  const xTicks = [];
  const tickStep = xMaxAdj > 80 ? 20 : 10;
  for (let x = 0; x <= xMaxAdj; x += tickStep) xTicks.push(x);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ touchAction: "none" }}
      onMouseLeave={() => setHoverT(null)}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const px = ((e.clientX - r.left) / r.width) * W;
        const u = (px - ML) / pw;
        if (u < 0 || u > 1) return setHoverT(null);
        const xm = u * xMaxAdj;
        let best = run.samples[0], bd = Infinity;
        for (const s of run.samples) { const d = Math.abs(s.x - xm); if (d < bd) { bd = d; best = s; } }
        setHoverT(best.t);
      }}>
      <rect x={ML} y={MT} width={pw} height={ph} fill="#fdfdfc" />
      {xTicks.map((x) => (
        <g key={x}>
          <line x1={sx(x)} y1={MT} x2={sx(x)} y2={MT + ph} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={sx(x)} y={MT + ph + 16}>{x}</AxisLabel>
        </g>
      ))}
      {[0, 5, 10, 15, 20, 25, 30].filter((y) => y <= yMax).map((y) => (
        <g key={y}>
          <line x1={ML} y1={sy(y)} x2={ML + pw} y2={sy(y)} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={ML - 8} y={sy(y) + 4} anchor="end">{y}</AxisLabel>
        </g>
      ))}
      <line x1={ML} y1={sy(0)} x2={ML + pw} y2={sy(0)} stroke="#c9c8c3" strokeWidth={1.5} />
      <AxisLabel x={ML + pw / 2} y={H - 4}>horizontal distance (m)</AxisLabel>
      <text x={14} y={MT + ph / 2} textAnchor="middle" fontSize={11} fill={C.ink2}
        transform={`rotate(-90 14 ${MT + ph / 2})`}>height (m)</text>

      <path d={vacPath} fill="none" stroke={C.vacuum} strokeWidth={1.5} strokeDasharray="5 4" />
      <text x={sx(vacRange) - 6} y={sy(0) - 8} textAnchor="end" fontSize={11} fill={C.vacuum}
        stroke="#fdfdfc" strokeWidth={3} paintOrder="stroke">vacuum {fmt(vacRange)} m</text>

      <path d={path} fill="none" stroke="#334155" strokeWidth={2} />

      <clipPath id="plotClip">
        <rect x={ML} y={MT} width={pw} height={ph} />
      </clipPath>
      <g clipPath="url(#plotClip)">
        {glyphs.map((s, i) => (
          <g key={i}>
            {wedge(s, 15)}
            {arrow(s, velLen, { stroke: C.beta, strokeWidth: 1.6, opacity: 0.85 })}
            {seg(s, discHalf, s.theta, { stroke: C.theta, strokeWidth: 3.2, strokeLinecap: "round" })}
          </g>
        ))}
      </g>

      {hov && (
        <g>
          <line x1={sx(hov.x)} y1={MT} x2={sx(hov.x)} y2={MT + ph} stroke="#94a3b8" strokeWidth={1} strokeDasharray="3 3" />
          {wedge(hov, 30)}
          {arrow(hov, velLen * 1.5, { stroke: C.beta, strokeWidth: 2.4 })}
          {seg(hov, discHalf * 1.35, hov.theta, { stroke: C.theta, strokeWidth: 4.5, strokeLinecap: "round" })}
          <circle cx={sx(hov.x)} cy={sy(hov.y)} r={3.5} fill="#fff" stroke="#334155" strokeWidth={2} />
          <g transform={`translate(${Math.min(sx(hov.x) + 10, ML + pw - 132)} ${MT + 8})`}>
            <rect width={128} height={56} rx={4} fill="#ffffff" stroke="#cbd5e1" />
            <text x={8} y={16} fontSize={10.5} fill={C.ink2}>t = {fmt(hov.t, 2)} s</text>
            <text x={8} y={30} fontSize={10.5} fill={C.theta}>θ = {fmt(hov.theta)}°</text>
            <text x={8} y={42} fontSize={10.5} fill={C.beta}>β = {fmt(hov.beta)}°</text>
            <text x={8} y={54} fontSize={10.5} fill={hov.alpha > STALL_DEG ? C.stall : C.alpha} fontWeight={600}>
              α = {fmt(hov.alpha)}°{hov.alpha > STALL_DEG ? " (stalled)" : ""}
            </text>
          </g>
        </g>
      )}
    </svg>
  );
}

/* ---- 2. The sweep: theta, beta and alpha against time -------------------- */
function AngleChart({ run, hoverT, setHoverT }) {
  const W = 470, H = 300, ML = 38, MR = 46, MT = 16, MB = 32;
  const pw = W - ML - MR, ph = H - MT - MB;
  const T = run.flightTime;

  const aMin = Math.min(-15, ...run.samples.map((s) => Math.min(s.alpha, s.beta, s.theta))) - 5;
  const aMax = Math.max(45, ...run.samples.map((s) => Math.max(s.alpha, s.beta, s.theta))) + 5;
  const sx = makeScale(0, T, ML, ML + pw);
  const sy = makeScale(aMin, aMax, MT + ph, MT);

  const line = (key) => run.samples.map((s, i) => `${i ? "L" : "M"}${sx(s.t).toFixed(1)} ${sy(s[key]).toFixed(1)}`).join(" ");
  // alpha is drawn twice: attached band, then the stalled part on top in red
  const stalled = [];
  let cur = [];
  for (const s of run.samples) {
    if (s.alpha > STALL_DEG) cur.push(s);
    else if (cur.length) { stalled.push(cur); cur = []; }
  }
  if (cur.length) stalled.push(cur);

  const hov = hoverT == null ? null
    : run.samples[Math.min(run.samples.length - 1, Math.round((hoverT / T) * (run.samples.length - 1)))];

  const ticks = [];
  for (let a = Math.ceil(aMin / 15) * 15; a <= aMax; a += 15) ticks.push(a);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ touchAction: "none" }}
      onMouseLeave={() => setHoverT(null)}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const u = (((e.clientX - r.left) / r.width) * W - ML) / pw;
        setHoverT(u < 0 || u > 1 ? null : u * T);
      }}>
      <rect x={ML} y={MT} width={pw} height={ph} fill="#fdfdfc" />
      <rect x={ML} y={MT} width={pw} height={Math.max(0, sy(STALL_DEG) - MT)} fill={C.stall} opacity={0.06} />
      {ticks.map((a) => (
        <g key={a}>
          <line x1={ML} y1={sy(a)} x2={ML + pw} y2={sy(a)} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={ML - 6} y={sy(a) + 4} anchor="end">{a}</AxisLabel>
        </g>
      ))}
      <line x1={ML} y1={sy(0)} x2={ML + pw} y2={sy(0)} stroke="#c9c8c3" strokeWidth={1.5} />
      <line x1={ML} y1={sy(STALL_DEG)} x2={ML + pw} y2={sy(STALL_DEG)} stroke={C.stall} strokeWidth={1.5} strokeDasharray="5 4" />
      <AxisLabel x={ML + 6} y={MT + 13} anchor="start" fill={C.stall} size={10} weight={600}>stall band — α &gt; 30°</AxisLabel>
      {[0, 1, 2, 3, 4, 5, 6].filter((t) => t <= T).map((t) => (
        <g key={t}>
          <line x1={sx(t)} y1={MT} x2={sx(t)} y2={MT + ph} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={sx(t)} y={MT + ph + 15}>{t}</AxisLabel>
        </g>
      ))}
      <AxisLabel x={ML + pw / 2} y={H - 2}>time (s)</AxisLabel>

      <path d={line("theta")} fill="none" stroke={C.theta} strokeWidth={2} />
      <path d={line("beta")} fill="none" stroke={C.beta} strokeWidth={2} />
      <path d={line("alpha")} fill="none" stroke={C.alpha} strokeWidth={2.4} />
      {stalled.map((seg, i) => (
        <path key={i} fill="none" stroke={C.stall} strokeWidth={2.8}
          d={seg.map((s, j) => `${j ? "L" : "M"}${sx(s.t).toFixed(1)} ${sy(s.alpha).toFixed(1)}`).join(" ")} />
      ))}

      {/* direct labels — identity never rests on colour alone */}
      {(() => {
        const last = run.samples[run.samples.length - 1];
        return (
          <g fontSize={11} fontWeight={600}>
            <text x={ML + pw + 4} y={sy(last.theta) + 4} fill={C.theta}>θ</text>
            <text x={ML + pw + 4} y={sy(last.beta) + 4} fill={C.beta}>β</text>
            <text x={ML + pw + 4} y={sy(last.alpha) + 4} fill={last.alpha > STALL_DEG ? C.stall : C.alpha}>α</text>
          </g>
        );
      })()}

      {hov && (
        <g>
          <line x1={sx(hov.t)} y1={MT} x2={sx(hov.t)} y2={MT + ph} stroke="#94a3b8" strokeWidth={1} strokeDasharray="3 3" />
          <circle cx={sx(hov.t)} cy={sy(hov.theta)} r={3.5} fill={C.theta} stroke="#fff" strokeWidth={2} />
          <circle cx={sx(hov.t)} cy={sy(hov.beta)} r={3.5} fill={C.beta} stroke="#fff" strokeWidth={2} />
          <circle cx={sx(hov.t)} cy={sy(hov.alpha)} r={3.5} fill={hov.alpha > STALL_DEG ? C.stall : C.alpha} stroke="#fff" strokeWidth={2} />
        </g>
      )}
    </svg>
  );
}

/* ---- 3. Range against release alpha (theta swept at fixed beta) ---------- */
function AlphaSweepChart({ sweep, currentAlpha, currentRange }) {
  const W = 470, H = 300, ML = 44, MR = 16, MT = 16, MB = 34;
  const pw = W - ML - MR, ph = H - MT - MB;
  const xs = sweep.map((d) => d.alpha), ys = sweep.map((d) => d.range);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys) - 2, y1 = Math.max(...ys) + 2;
  const sx = makeScale(x0, x1, ML, ML + pw);
  const sy = makeScale(y0, y1, MT + ph, MT);
  const best = sweep.reduce((a, b) => (b.range > a.range ? b : a), sweep[0]);
  const path = sweep.map((d, i) => `${i ? "L" : "M"}${sx(d.alpha).toFixed(1)} ${sy(d.range).toFixed(1)}`).join(" ");

  const xt = [];
  for (let a = Math.ceil(x0 / 15) * 15; a <= x1; a += 15) xt.push(a);
  const yt = [];
  const ystep = y1 - y0 > 40 ? 20 : 10;
  for (let r = Math.ceil(y0 / ystep) * ystep; r <= y1; r += ystep) yt.push(r);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
      <rect x={ML} y={MT} width={pw} height={ph} fill="#fdfdfc" />
      {xt.map((a) => (
        <g key={a}>
          <line x1={sx(a)} y1={MT} x2={sx(a)} y2={MT + ph} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={sx(a)} y={MT + ph + 15}>{a}</AxisLabel>
        </g>
      ))}
      {yt.map((r) => (
        <g key={r}>
          <line x1={ML} y1={sy(r)} x2={ML + pw} y2={sy(r)} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={ML - 6} y={sy(r) + 4} anchor="end">{r}</AxisLabel>
        </g>
      ))}
      {x0 < 0 && x1 > 0 && (
        <g>
          <line x1={sx(0)} y1={MT} x2={sx(0)} y2={MT + ph} stroke="#c9c8c3" strokeWidth={1.5} />
          <AxisLabel x={sx(0) + 5} y={MT + 12} anchor="start" size={10}>α = 0</AxisLabel>
        </g>
      )}
      <AxisLabel x={ML + pw / 2} y={H - 3}>release angle of attack α = θ − β (deg)</AxisLabel>
      <text x={13} y={MT + ph / 2} textAnchor="middle" fontSize={11} fill={C.ink2}
        transform={`rotate(-90 13 ${MT + ph / 2})`}>range (m)</text>

      <path d={path} fill="none" stroke={C.alpha} strokeWidth={2.4} />
      <circle cx={sx(best.alpha)} cy={sy(best.range)} r={5} fill={C.alpha} stroke="#fff" strokeWidth={2} />
      <text x={sx(best.alpha)} y={sy(best.range) - 12} textAnchor="middle" fontSize={11} fontWeight={600} fill={C.ink}>
        best α ≈ {fmt(best.alpha, 0)}°
      </text>
      <text x={sx(best.alpha)} y={sy(best.range) - 25} textAnchor="middle" fontSize={10.5} fill={C.ink2}>
        {fmt(best.range)} m
      </text>
      {currentAlpha >= x0 && currentAlpha <= x1 && (
        <g>
          <circle cx={sx(currentAlpha)} cy={sy(currentRange)} r={4.5} fill="#fff" stroke="#334155" strokeWidth={2} />
          <text x={sx(currentAlpha)} y={sy(currentRange) + 20} textAnchor="middle" fontSize={10.5} fill={C.ink2}>your release</text>
        </g>
      )}
    </svg>
  );
}

/* ---- 4. The coefficient curves ------------------------------------------ */
function CoefficientChart({ alphaRelease, alphaMax }) {
  const W = 470, H = 250, ML = 42, MR = 16, MT = 14, MB = 34;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = makeScale(-45, 75, ML, ML + pw);
  const sy = makeScale(-1.3, 1.35, MT + ph, MT);
  const pts = [];
  for (let a = -45; a <= 75; a += 0.5) pts.push(a);
  const p = (f) => pts.map((a, i) => `${i ? "L" : "M"}${sx(a).toFixed(1)} ${sy(f(a)).toFixed(1)}`).join(" ");

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
      <rect x={ML} y={MT} width={pw} height={ph} fill="#fdfdfc" />
      <rect x={sx(STALL_DEG)} y={MT} width={ML + pw - sx(STALL_DEG)} height={ph} fill={C.stall} opacity={0.06} />
      {[-1, -0.5, 0, 0.5, 1].map((c) => (
        <g key={c}>
          <line x1={ML} y1={sy(c)} x2={ML + pw} y2={sy(c)} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={ML - 6} y={sy(c) + 4} anchor="end">{c}</AxisLabel>
        </g>
      ))}
      {[-30, -15, 0, 15, 30, 45, 60, 75].map((a) => (
        <g key={a}>
          <line x1={sx(a)} y1={MT} x2={sx(a)} y2={MT + ph} stroke={C.grid} strokeWidth={1} />
          <AxisLabel x={sx(a)} y={MT + ph + 15}>{a}</AxisLabel>
        </g>
      ))}
      <line x1={ML} y1={sy(0)} x2={ML + pw} y2={sy(0)} stroke="#c9c8c3" strokeWidth={1.5} />
      <line x1={sx(0)} y1={MT} x2={sx(0)} y2={MT + ph} stroke="#c9c8c3" strokeWidth={1.5} />
      <AxisLabel x={ML + pw / 2} y={H - 3}>angle of attack α (deg)</AxisLabel>

      {/* the band this throw actually visits, clamped to the plotted domain */}
      {(() => {
        const lo = Math.max(ML, sx(Math.min(alphaRelease, alphaMax)));
        const hi = Math.min(ML + pw, sx(Math.max(alphaRelease, alphaMax)));
        return (
          <g>
            <rect x={lo} y={MT} height={ph} width={Math.max(2, hi - lo)} fill="#334155" opacity={0.07} />
            <AxisLabel x={lo + 4} y={MT + ph - 6} anchor="start" size={10} fill={C.ink2}>
              α band this throw visits
            </AxisLabel>
          </g>
        );
      })()}

      <path d={p(liftCoefficient)} fill="none" stroke={C.cl} strokeWidth={2.2} />
      <path d={p(dragCoefficient)} fill="none" stroke={C.cd} strokeWidth={2.2} />
      <text x={sx(22)} y={sy(liftCoefficient(22)) - 8} fontSize={11} fontWeight={600} fill={C.cl}>C_L</text>
      <text x={sx(52)} y={sy(dragCoefficient(52)) - 8} fontSize={11} fontWeight={600} fill={C.cd}>C_D</text>
      <circle cx={sx(0)} cy={sy(0)} r={3.5} fill="#fff" stroke={C.cl} strokeWidth={2} />
      <text x={sx(0) + 6} y={sy(0) - 8} fontSize={10} fill={C.ink2}>C_L(0) = 0</text>
    </svg>
  );
}

/* ---- validation panel ---------------------------------------------------- */
function Verdict({ ok }) {
  return (
    <span className={`inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-xs font-medium ${
      ok ? "bg-emerald-50 text-emerald-800" : "bg-amber-50 text-amber-900"}`}>
      {ok ? "✓ in band" : "! outside band"}
    </span>
  );
}

/* ============================================================================
 * Component
 * ==========================================================================*/
function DiscusAngleOfAttack() {
  const [beta, setBeta] = useState(35);
  const [theta, setTheta] = useState(26);
  const [v0, setV0] = useState(25);
  const [wind, setWind] = useState(0);
  const [y0, setY0] = useState(1.65);
  const [lockAlpha, setLockAlpha] = useState(false);
  const [alphaLock, setAlphaLock] = useState(-9);
  const [hoverT, setHoverT] = useState(null);
  const [showTable, setShowTable] = useState(false);

  const run = useMemo(() => simulate({ beta, theta, v0, wind, y0, lockAlpha, alphaLock }), [beta, theta, v0, wind, y0, lockAlpha, alphaLock]);
  const vac = useMemo(() => vacuumRange(beta, v0, y0), [beta, v0, y0]);
  const aeroDelta = run.range - vac;
  const alphaRel = lockAlpha ? alphaLock : theta - beta;

  // Range vs release alpha at the CURRENT beta / v0 / wind. Only recomputed
  // when those change, so dragging theta stays cheap.
  const sweep = useMemo(() => {
    const out = [];
    for (let th = 0; th <= 60; th += 3) {
      const r = simulate({ beta, theta: th, v0, wind, y0, sampleEvery: 100000 });
      out.push({ alpha: th - beta, theta: th, range: r.range });
    }
    return out;
  }, [beta, v0, wind, y0]);

  // Fixed-parameter sanity checks. Numbers are computed, never asserted.
  const checks = useMemo(() => {
    const base = { v0: 25, y0: 1.65, sampleEvery: 100000 };
    const elite = simulate({ ...base, beta: 35, theta: 26, wind: 0 });
    const flat = simulate({ ...base, beta: 35, theta: 35, wind: 0 });
    const nose = simulate({ ...base, beta: 35, theta: 50, wind: 0, sampleEvery: 10 });
    const head = simulate({ ...base, beta: 35, theta: 26, wind: -10 });
    const tail = simulate({ ...base, beta: 35, theta: 26, wind: 10 });
    const vac35 = vacuumRange(35, 25, 1.65);
    return { elite, flat, nose, head, tail, vac35 };
  }, []);

  const applyPreset = (p) => {
    setBeta(p.beta); setTheta(p.theta); setV0(p.v0); setWind(p.wind);
    setLockAlpha(false); setHoverT(null);
  };
  const activePreset = PRESETS.find(
    (p) => !lockAlpha && p.beta === beta && p.theta === theta && p.v0 === v0 && p.wind === wind);

  const alphaTone = alphaRel > STALL_DEG ? C.stall : alphaRel < 0 ? C.theta : C.alpha;
  const alphaWord = alphaRel > STALL_DEG ? "already past stall at release"
    : alphaRel < -1 ? "negative — the productive starting offset"
    : alphaRel < 1 ? "zero — no lift at all at release" : "positive at release";

  const rows = [
    {
      what: "Elite preset range (35° / 26°, 25 m/s, still air)",
      got: `${fmt(checks.elite.range)} m`,
      ref: "target 65–69 m; published 3-D optimum 69.39 m",
      ok: checks.elite.range >= 65 && checks.elite.range <= 69,
      note: "The published optimum is a full 3-D solution with roll; this 2-D model has no roll to exploit, so landing just inside the band is the most it can claim.",
    },
    {
      what: "Aerodynamic contribution at the elite preset",
      got: `${checks.elite.range - checks.vac35 >= 0 ? "+" : ""}${fmt(checks.elite.range - checks.vac35)} m`,
      ref: `vacuum range for the same release = ${fmt(checks.vac35)} m (analytic); air should be worth a few metres`,
      ok: Math.abs(checks.elite.range - checks.vac35) < 12,
      note: "Air should be worth a few metres, not tens. If this ever reads +20 m the lift curve has run away.",
    },
    {
      what: "Cost of releasing flat (35°/35°) instead of 35°/26°",
      got: `${fmt(checks.elite.range - checks.flat.range)} m lost`,
      ref: "published 1.55 m",
      ok: checks.elite.range - checks.flat.range >= 1 && checks.elite.range - checks.flat.range <= 2,
      note: "The model overstates this. With θ frozen, the flat release sits ~9° deeper in stall for the whole back half; a real disc rolls out of some of that penalty. Direction right, magnitude roughly double.",
    },
    {
      what: "10 m/s headwind minus 10 m/s tailwind (same 35°/26° release)",
      got: `${fmt(checks.head.range - checks.tail.range)} m`,
      ref: "Frohlich computed 8.2 m",
      ok: Math.abs(checks.head.range - checks.tail.range - 8.2) <= 3,
      note: `Headwind ${fmt(checks.head.range)} m vs tailwind ${fmt(checks.tail.range)} m. A headwind raises relative airspeed, and lift goes as its square.`,
    },
    {
      what: "Nose-up preset (35°/50°) reaches stall",
      got: checks.nose.stallTime === null ? "never stalls" : `stalls at t = ${fmt(checks.nose.stallTime, 2)} s of ${fmt(checks.nose.flightTime, 2)} s`,
      ref: "should stall early and lose distance",
      ok: checks.nose.stallTime !== null && checks.nose.stallTime < 0.4 * checks.nose.flightTime,
      note: `Range ${fmt(checks.nose.range)} m — ${fmt(checks.elite.range - checks.nose.range)} m behind the elite preset, and below the vacuum range: the air is a net liability here.`,
    },
    {
      what: "α increases monotonically through the current flight",
      got: run.monotoneAlpha ? "yes" : "no",
      ref: "the central claim, for the throw you have dialled in",
      ok: run.monotoneAlpha,
      note: "β falls monotonically while θ is frozen, so α = θ − β must rise. It can break at extreme settings where the relative-wind direction reverses.",
    },
  ];

  return (
    <div className="min-h-screen bg-slate-50 px-4 py-8 text-slate-900">
      <div className="mx-auto max-w-6xl space-y-5">

        <header className="space-y-3">
          <p className="text-xs font-semibold uppercase tracking-widest text-slate-500">Throwing aerodynamics</p>
          <h1 className="text-3xl font-bold tracking-tight text-slate-900">
            Why elite discus throwers release with a negative angle of attack
          </h1>
          <p className="max-w-3xl text-sm leading-relaxed text-slate-600">
            A discus is nearly symmetric top to bottom, so at α = 0 it makes no lift, and at negative α
            it makes <em>downforce</em>. Releasing nose-down therefore looks like a mistake. It isn't —
            because α does not stay where you put it. Gyroscopic stiffness holds the disc's attitude θ
            nearly fixed while the velocity vector β swings from climbing, through horizontal at apex,
            to steeply descending. So α = θ − β <strong>rises through the whole flight</strong>. A
            negative α at release is a starting offset chosen so the disc spends the back half of its
            flight inside the productive lift band, instead of arriving at apex already stalling.
          </p>
        </header>

        {/* definitions */}
        <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-4">
          {[
            ["β", "flight-path angle", "velocity vector above horizontal", C.beta],
            ["θ", "attitude angle", "plane of the disc above horizontal", C.theta],
            ["α", "angle of attack", "α = θ − β, in the 2-D vertical plane", C.alpha],
            ["φ", "tilt / roll", "out of that plane — not simulated here", "#94a3b8"],
          ].map(([sym, name, def, col]) => (
            <div key={sym} className="rounded-lg border border-slate-200 bg-white p-3">
              <div className="flex items-baseline gap-2">
                <span className="text-lg font-semibold" style={{ color: col }}>{sym}</span>
                <span className="text-xs font-medium text-slate-700">{name}</span>
              </div>
              <p className="mt-1 text-xs leading-snug text-slate-500">{def}</p>
            </div>
          ))}
        </div>

        {/* controls */}
        <Card title="Release parameters"
          subtitle="Presets set β, θ, v₀ and wind together. Everything downstream recomputes from the same simulate() call.">
          <div className="mb-4 flex flex-wrap gap-2">
            {PRESETS.map((p) => (
              <button key={p.key} onClick={() => applyPreset(p)}
                className={`rounded-md border px-2.5 py-1.5 text-xs font-medium transition ${
                  activePreset?.key === p.key
                    ? "border-slate-800 bg-slate-800 text-white"
                    : "border-slate-300 bg-white text-slate-700 hover:border-slate-400 hover:bg-slate-50"}`}>
                {p.name}
              </button>
            ))}
          </div>
          {activePreset && (
            <p className="mb-4 rounded-md bg-slate-50 px-3 py-2 text-xs leading-relaxed text-slate-600">
              {activePreset.note}
            </p>
          )}

          <div className="grid gap-x-8 gap-y-4 md:grid-cols-2 lg:grid-cols-3">
            <Slider label="β — release flight-path angle" unit="°" value={beta} min={20} max={55} step={1}
              onChange={setBeta} color={C.beta} />
            {lockAlpha ? (
              <Slider label="α — locked angle of attack" unit="°" value={alphaLock} min={-25} max={40} step={1}
                onChange={setAlphaLock} color={C.alpha} hint="θ now tracks β + α — the disc is being flown, not thrown." />
            ) : (
              <Slider label="θ — release attitude angle" unit="°" value={theta} min={0} max={60} step={1}
                onChange={setTheta} color={C.theta} hint="Held fixed for the whole flight." />
            )}
            <Slider label="v₀ — release speed" unit="m/s" value={v0} min={15} max={30} step={0.5} onChange={setV0} decimals={1} />
            <Slider label="wind (+ tailwind / − headwind)" unit="m/s" value={wind} min={-15} max={15} step={0.5}
              onChange={setWind} decimals={1} signed hint="Horizontal component only. Negative = blowing back at the thrower." />
            <Slider label="release height" unit="m" value={y0} min={1.2} max={2.2} step={0.05} onChange={setY0} decimals={2} />
            <label className="flex items-start gap-2 pt-1">
              <input type="checkbox" className="mt-0.5 accent-slate-700" checked={lockAlpha}
                onChange={(e) => setLockAlpha(e.target.checked)} />
              <span className="text-xs leading-snug text-slate-700">
                <span className="font-medium">Lock α instead of θ</span>
                <span className="block text-slate-500">
                  Physically wrong on purpose: it takes a control surface, not a spinning disc. Use it to see
                  what the frozen-θ sweep is actually buying.
                </span>
              </span>
            </label>
          </div>

          <div className="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <div className="rounded-lg border-2 p-3" style={{ borderColor: alphaTone }}>
              <div className="text-xs font-medium text-slate-500">α at release = θ − β</div>
              <div className="mt-0.5 text-3xl font-bold tabular-nums" style={{ color: alphaTone }}>
                {alphaRel > 0 ? "+" : ""}{fmt(alphaRel)}°
              </div>
              <div className="mt-0.5 text-xs" style={{ color: alphaTone }}>{alphaWord}</div>
            </div>
            <div className="rounded-lg border border-slate-200 bg-white p-3">
              <div className="text-xs font-medium text-slate-500">α at landing</div>
              <div className="mt-0.5 text-3xl font-bold tabular-nums"
                style={{ color: run.alphaLanding > STALL_DEG ? C.stall : C.alpha }}>
                {fmt(run.alphaLanding, 0)}°
              </div>
              <div className="mt-0.5 text-xs text-slate-500">
                swept {fmt(run.alphaLanding - alphaRel, 0)}° during {fmt(run.flightTime, 2)} s of flight
              </div>
            </div>
            <div className="rounded-lg border border-slate-200 bg-white p-3">
              <div className="text-xs font-medium text-slate-500">range with air</div>
              <div className="mt-0.5 text-3xl font-bold tabular-nums text-slate-900">{fmt(run.range)} m</div>
              <div className="mt-0.5 text-xs text-slate-500">apex {fmt(run.apex)} m · {fmt(run.flightTime, 2)} s</div>
            </div>
            <div className="rounded-lg border border-slate-200 bg-white p-3">
              <div className="text-xs font-medium text-slate-500">aerodynamic contribution</div>
              <div className="mt-0.5 text-3xl font-bold tabular-nums"
                style={{ color: aeroDelta >= 0 ? "#0ca30c" : C.stall }}>
                {aeroDelta >= 0 ? "+" : "−"}{fmt(Math.abs(aeroDelta))} m
              </div>
              <div className="mt-0.5 text-xs text-slate-500">vs vacuum {fmt(vac)} m at the same β, v₀, height</div>
            </div>
          </div>
        </Card>

        {/* trajectory */}
        <Card
          title="The velocity vector rotates under a nearly fixed disc"
          subtitle="Every 0.4 s: the disc's plane (θ) as a blue segment at ten times actual size — the angle is true, the length is not — and the direction it is travelling through the air (β) as a violet arrow. The shaded wedge between them is α itself, drawn to scale. In wind, β is not tangent to the ground path; α is always measured from the air-relative direction."
          right={<LegendRow items={[
            { label: "disc plane θ", color: C.theta },
            { label: "airspeed direction β", color: C.beta },
            { label: "α between them", color: C.alpha },
            { label: "vacuum path", color: C.vacuum, dash: true },
          ]} />}>
          <TrajectoryChart run={run} vacRange={vac} beta={beta} v0={v0} y0={y0}
            hoverT={hoverT} setHoverT={setHoverT} />
          <div className="mt-2 flex items-center gap-3">
            <span className="text-xs text-slate-500">scrub</span>
            <input type="range" className="w-full accent-slate-700" min={0} max={run.flightTime} step={0.01}
              value={hoverT ?? 0} onChange={(e) => setHoverT(parseFloat(e.target.value))} />
            <button className="whitespace-nowrap rounded border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-slate-50"
              onClick={() => setHoverT(null)}>clear</button>
          </div>
          <p className="mt-2 text-xs leading-relaxed text-slate-500">
            {alphaRel < -0.5 ? (
              <>
                At release the blue segment sits <em>below</em> the violet arrow: the disc is nose-down into its
                own airflow, and the lift force points downward. That is the cost. Past apex the arrow has swung
                below the blue segment and keeps swinging, and the same fixed disc is now nose-up into the flow,
                making lift that holds the throw up. That is what the cost bought.
              </>
            ) : (
              <>
                At release the blue segment already sits <em>at or above</em> the violet arrow, so the disc starts
                with a positive angle of attack and has nowhere to go but deeper. Set θ below β and watch the
                early wedge invert.
              </>
            )}{" "}
            Watch the wedge either way: it is α, drawn to scale, and it only ever opens further as the flight
            goes on. That monotone opening is the whole argument for releasing nose-down.
          </p>
        </Card>

        <div className="grid gap-5 lg:grid-cols-2">
          <Card title="α sweeps; θ does not"
            subtitle="θ frozen, β falling from its release value through 0 at apex to steeply negative. Their difference is the whole story."
            right={<LegendRow items={[
              { label: "θ attitude", color: C.theta },
              { label: "β flight path", color: C.beta },
              { label: "α = θ − β", color: C.alpha },
              { label: "α past stall", color: C.stall },
            ]} />}>
            <AngleChart run={run} hoverT={hoverT} setHoverT={setHoverT} />
            <p className="mt-2 text-xs leading-relaxed text-slate-500">
              {run.stallTime === null
                ? "This throw never crosses the 30° stall line — α stays in the attached, lift-producing band for the whole flight."
                : `α crosses the 30° stall line at t = ${fmt(run.stallTime, 2)} s, with ${fmt(run.flightTime - run.stallTime, 2)} s of flight left. Starting lower delays that crossing; that is what the negative release offset buys.`}
            </p>
          </Card>

          <Card title="Range against release α"
            subtitle={`θ swept 0–60° with β = ${fmt(beta, 0)}°, v₀ = ${fmt(v0, 1)} m/s and wind = ${fmt(wind, 1)} m/s held fixed. One full simulation per point.`}>
            <AlphaSweepChart sweep={sweep} currentAlpha={alphaRel} currentRange={run.range} />
            <p className="mt-2 text-xs leading-relaxed text-slate-500">
              The model is not told to prefer a negative release α — it finds one. At these settings the peak
              sits at α ≈ {fmt(sweep.reduce((a, b) => (b.range > a.range ? b : a), sweep[0]).alpha, 0)}°, and
              α = 0 is measurably down the slope from it. Change the wind and watch the peak move: into a
              headwind it goes further negative, downwind it goes positive.
            </p>
          </Card>
        </div>

        <div className="grid gap-5 lg:grid-cols-2">
          <Card title="The coefficients this model uses"
            subtitle="Approximating published wind-tunnel behaviour — not a published table. The shaded strip is the α band this particular throw visits.">
            <CoefficientChart alphaRelease={Math.min(alphaRel, run.maxAlpha)} alphaMax={Math.max(alphaRel, run.maxAlpha)} />
            <button onClick={() => setShowTable((s) => !s)}
              className="mt-2 rounded border border-slate-300 px-2 py-1 text-xs text-slate-600 hover:bg-slate-50">
              {showTable ? "hide" : "show"} provenance table
            </button>
            {showTable && (
              <div className="mt-3 overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="text-slate-500">
                    <tr><th className="py-1 pr-3 font-medium">Element</th><th className="py-1 pr-3 font-medium">Source</th><th className="py-1 font-medium">Comment</th></tr>
                  </thead>
                  <tbody className="align-top">
                    {COEFF_PROVENANCE.map(([el, src, note]) => (
                      <tr key={el} className="border-t border-slate-100">
                        <td className="py-1.5 pr-3 font-mono text-slate-800">{el}</td>
                        <td className="py-1.5 pr-3">
                          <span className={`rounded px-1.5 py-0.5 font-medium ${
                            src === "TUNED HERE" ? "bg-amber-50 text-amber-900" : "bg-slate-100 text-slate-700"}`}>{src}</span>
                        </td>
                        <td className="py-1.5 text-slate-600">{note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Card>

          <Card title="The pitching moment, and what it really does"
            subtitle="C_M is positive (nose-up) for positive α — modelled as a diagnostic, deliberately not fed into the 2-D translation.">
            <div className="space-y-3 text-sm">
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-lg border border-slate-200 p-3">
                  <div className="text-xs font-medium text-slate-500">peak nose-up moment</div>
                  <div className="mt-0.5 text-2xl font-bold tabular-nums text-slate-900">
                    {fmt(Math.max(...run.samples.map((s) => s.moment)), 2)} N·m
                  </div>
                </div>
                <div className="rounded-lg border border-slate-200 p-3">
                  <div className="text-xs font-medium text-slate-500">precession accumulated</div>
                  <div className="mt-0.5 text-2xl font-bold tabular-nums" style={{ color: C.stall }}>
                    {fmt(run.precessionDeg, 0)}°
                  </div>
                </div>
              </div>
              <p className="text-xs leading-relaxed text-slate-600">
                On a non-spinning plate that nose-up moment would pitch the disc, and a positive α would grow
                until it stalled — which is the textbook reason a positive α is unstable. A discus spins at
                about {SPIN_HZ} rev/s, so instead of pitching it <strong>precesses</strong>: the moment turns
                the angular-momentum vector at a rate Ω = M / (I·ω), with I = {fmt(I_SPIN, 4)} kg·m² and
                I·ω = {fmt(I_SPIN * OMEGA, 3)} kg·m²/s. Integrating that along this trajectory gives about{" "}
                <strong>{fmt(run.precessionDeg, 0)}° of turning</strong>, and on a spinning disc it shows up
                mainly as <strong>roll (φ)</strong>, not pitch.
              </p>
              <p className="rounded-md bg-amber-50 px-3 py-2 text-xs leading-relaxed text-amber-900">
                That number is the size of this model's own error. {fmt(run.precessionDeg, 0)}° is not a
                small correction to a frozen θ — it is comparable to the 54.4° release tilt in the published
                3-D optimum. Read the sweep below apex as illustrative, not quantitative.
              </p>
            </div>
          </Card>
        </div>

        {/* validation */}
        <Card title="Validation against published values"
          subtitle="Computed live from the same simulate() the charts use, at fixed reference parameters — independent of the sliders above. Bands are stated so you can see the misses, not just the hits.">
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead className="text-slate-500">
                <tr>
                  <th className="py-1.5 pr-3 font-medium">Check</th>
                  <th className="py-1.5 pr-3 font-medium">This model</th>
                  <th className="py-1.5 pr-3 font-medium">Reference</th>
                  <th className="py-1.5 pr-3 font-medium">Verdict</th>
                </tr>
              </thead>
              <tbody className="align-top">
                {rows.map((r) => (
                  <tr key={r.what} className="border-t border-slate-100">
                    <td className="py-2 pr-3 text-slate-800">{r.what}</td>
                    <td className="py-2 pr-3 font-mono font-semibold tabular-nums text-slate-900">{r.got}</td>
                    <td className="py-2 pr-3 text-slate-600">{r.ref}</td>
                    <td className="py-2 pr-3"><Verdict ok={r.ok} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <ul className="mt-3 space-y-1.5 text-xs leading-relaxed text-slate-500">
            {rows.map((r) => (<li key={r.what}><span className="text-slate-700">{r.what}:</span> {r.note}</li>))}
          </ul>
        </Card>

        {/* caveats */}
        <Card title="What this model is not">
          <div className="grid gap-4 text-xs leading-relaxed text-slate-600 md:grid-cols-2">
            <div className="space-y-2">
              <p>
                <strong className="text-slate-800">It is the 2-D idealisation.</strong> Everything happens in the
                vertical plane of the throw. φ is defined in the UI but never simulated, and α = θ − β is only
                the angle of attack when there is no roll.
              </p>
              <p>
                <strong className="text-slate-800">θ is not really frozen.</strong> The nose-up pitching moment
                precesses a spinning disc mainly <em>in roll</em>. The real optimum releases the disc inclined —
                Hubbard &amp; Cheng put the 3-D optimum at β = 38.4°, θ = 30.7°, φ = 54.4°, v₀ = 25 m/s for
                69.39 m — and the disc rolls progressively flat through the second half of the flight. Rolling
                flat is how a real throw keeps its effective angle of attack moderate late on.
              </p>
              <p>
                <strong className="text-slate-800">So the sweep is overstated after apex.</strong> This model
                drives α past 60° on the descent because nothing relieves it. A real disc that has rolled
                towards flat never sees anything like that. Treat the front half as roughly quantitative and the
                back half as directional: the sign and the mechanism are right, the late magnitudes are not.
              </p>
            </div>
            <div className="space-y-2">
              <p>
                <strong className="text-slate-800">Published vs tuned.</strong> Published or definitional: mass,
                diameter, area, air density, the 3-D optimum and its release parameters, the 1.55 m flat-release
                penalty, Frohlich's 8.2 m wind spread, the ~0.04/deg lift slope, the ~30° stall, the
                +0.006–0.007/deg nose-up moment slope. Tuned here: the drag scale (3.0), the post-stall lift
                retention (0.60), and the exact shape of the drop past stall. The provenance table above marks
                each one.
              </p>
              <p>
                <strong className="text-slate-800">Left out entirely.</strong> Reynolds-number and spin-rate
                dependence of the coefficients; any Magnus force; the disc's own weight distribution and
                wobble; crosswind and the out-of-plane aerodynamics that go with it; vertical wind; the
                landing-sector geometry. Ground is a flat plane at y = 0 and the throw starts from a point.
              </p>
              <p>
                <strong className="text-slate-800">The lock-α toggle is not physics.</strong> Holding α constant
                requires something actively trimming the disc in flight. It is in the UI only as a contrast: it
                shows how much of the result comes from the sweep rather than from the release value.
              </p>
            </div>
          </div>
        </Card>

        <footer className="border-t border-slate-200 pt-4 text-xs leading-relaxed text-slate-500">
          <p className="mb-1 font-medium text-slate-700">Sources</p>
          <ul className="space-y-0.5">
            <li>Hubbard, M. &amp; Cheng, K. B. — <em>Optimal discus trajectories</em>. Journal of Biomechanics, 2007.</li>
            <li>Seo, K., Shimoyama, K., Ohta, K., Ohgi, Y. &amp; Kimura, Y. — <em>Aerodynamic behavior of a discus</em>. Procedia Engineering, 2012.</li>
            <li>Frohlich, C. — <em>Aerodynamic effects on discus flight</em>. American Journal of Physics, 1981.</li>
            <li>Leigh, S. &amp; Yu, B. — Journal of Biomechanics, 2010.</li>
          </ul>
          <p className="mt-2">
            Integration: RK4 at dt = 1 ms, terminated by interpolation to y = 0. Men's discus, m = {MASS} kg,
            d = {DIAM} m, A = {fmt(AREA, 4)} m², ρ = {RHO} kg/m³, g = {G} m/s², spin {SPIN_HZ} rev/s.
          </p>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DiscusAngleOfAttack />);
</script>
</body>
</html>
